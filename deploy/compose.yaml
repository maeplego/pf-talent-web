services:
  talent-web:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      TALENT_API_URL: ${TALENT_API_URL:-http://host.docker.internal:8091}
      CALENDAR_PUBLIC_WEB_URL: ${CALENDAR_PUBLIC_WEB_URL:-http://localhost:3005}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_INTERNAL_BASE: ${OIDC_INTERNAL_BASE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-}
      PORT: "3010"
    ports:
      - "3011:3010"
    extra_hosts:
      - "localhost:host-gateway"
